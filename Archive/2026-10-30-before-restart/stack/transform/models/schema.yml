# What we believe is true about the clean tables. `dbt build` checks all of it, every run.
#   contract: the table must have exactly these columns and types, or it isn't built.
#   data_tests: each one is a query for rows that break the rule. Zero rows = pass.

models:
  - name: sites
    config:
      contract: {enforced: true}
    columns:
      - name: site_code
        data_type: varchar
        data_tests: [unique, not_null]
      - name: site_name
        data_type: varchar
        data_tests: [not_null]
      - name: site_type
        data_type: varchar
      - name: latitude
        data_type: double
      - name: longitude
        data_type: double
      - name: date_opened
        data_type: timestamp
      - name: date_closed
        data_type: timestamp

  - name: readings
    config:
      contract: {enforced: true}
    columns:
      - name: site_code
        data_type: varchar
        data_tests:
          - not_null
          - relationships:                 # every reading belongs to a site we know about
              arguments: {to: ref('sites'), field: site_code}
      - name: species_code
        data_type: varchar
        data_tests:
          - accepted_values:
              arguments: {values: ['NO2']}
      - name: measured_at
        data_type: timestamp
        data_tests: [not_null]
      - name: value
        data_type: double
